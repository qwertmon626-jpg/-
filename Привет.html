<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Привет</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#101a3a;color:#fff;font-family:system-ui,sans-serif}
body{display:flex;align-items:center;justify-content:center;text-align:center}
.s{display:none;flex-direction:column;align-items:center;gap:24px;padding:16px}
.s.on{display:flex}
button{font:700 clamp(24px,7vw,40px) system-ui,sans-serif;padding:16px 48px;border:0;border-radius:12px;background:#ffd84a;color:#101a3a;cursor:pointer}
button:active{transform:scale(.96)}
button:focus-visible{outline:3px solid #7fe3ff;outline-offset:3px}
h1{font-size:clamp(32px,10vw,72px);margin:0;color:#ff6b9a}
#b{background:#7fe3ff;font-size:clamp(16px,4vw,22px);padding:10px 28px}
</style></head>
<body>
<div class="s on" id="a"><button id="go">Привет</button></div>
<div class="s" id="n"><h1>Иди нахуй</h1><button id="b">Назад</button></div>
<script>
const a=document.getElementById("a"),n=document.getElementById("n");
document.getElementById("go").onclick=()=>{a.classList.remove("on");n.classList.add("on")};
document.getElementById("b").onclick=()=>{n.classList.remove("on");a.classList.add("on")};
</script></body></html>
